<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#0B2545"/>
  <!-- Garage door icon -->
  <rect x="40" y="30" width="100" height="90" rx="8" ry="8" stroke="#FFFFFF" stroke-width="6" fill="none"/>
  <line x1="52" y1="55" x2="128" y2="55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="75" x2="128" y2="75" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="95" x2="128" y2="95" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Checkmark accent -->
  <polyline points="75,88 92,108 125,60" stroke="#2DBE7E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Text -->
  <text x="90" y="148" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">OPEN BAY</text>
